# rafoflow repository contract. Everything not set here comes from the package defaults
# (and from any preset listed in `extends`). Guardrails set by an inherited layer can be
# tightened here, never loosened.

# extends: ["@acme/rafoflow-preset"]

# Harness the implementing agent runs in (claude, codex or pi). Reviewers are routed to another vendor.
# For pi, also set session_provider (e.g. openai-codex).
session_harness: {{harness}}

# Commands this repository exposes. The process only ever calls these names.
commands:
  # typecheck: pnpm typecheck
  # test: pnpm test
  # lint: pnpm lint
  # docs_lint: pnpm docs:lint

# Which commands make up the gate, in order.
gate: []

docs:
  paths: ["docs/", "AGENTS.md", "README.md"]
  # Where earlier decisions live. The researcher checks them (and their git history) before recommending.
  # decisions: ["docs/decisions/", "CHANGELOG.md"]

# Paths whose change forces a minimum tier, whatever the classifier says.
risk_markers: []
#  - { path: "db/migrations/**", tier: L, reason: migration }
#  - { path: "src/payments/**", tier: L, reason: payments }

# Override the role x tier routing table (see `rafoflow doctor` for the effective table).
# routing:
#   fixer:
#     M: { harness: claude, model: sonnet }

# Human checkpoint before the fixer edits code, per tier.
# checkpoints:
#   M: { before_fix: true }

# Guard: enforced from outside the agent by a harness hook (`rafoflow init` installs it for Claude Code;
# `rafoflow doctor` reports it). A repo can add entries here, never remove ones an inherited layer set.
# guard:
#   # Regexes over shell commands. A match runs only with the shipped paths committed and the gate green. `--dry-run` passes.
#   ship_commands: ["\\bwrangler\\s+deploy\\b", "\\bpnpm\\s+publish\\b"]
#   # The bundle is built from the working tree: uncommitted code here blocks the ship (production must trace to a commit).
#   ship_requires_clean: ["packages/**"]
#   # The agent does not edit the files that define its own gate; a human records `rafoflow approve protected`.
#   protected_paths: ["eslint.config.*", "Makefile"]
